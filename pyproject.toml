[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capture-one-ai-macos"
version = "0.3.0a3"
description = "Native Capture One editing on macOS via MCP and CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "Pillow>=11"]

[project.urls]
Repository = "https://github.com/iscca/capture-one-ai-macos"
Issues = "https://github.com/iscca/capture-one-ai-macos/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
c1ai = "c1ai.__main__:main"
c1ai-mcp = "c1ai.mcp_server:main"

[tool.setuptools]
packages = ["c1ai"]
include-package-data = true

[tool.setuptools.package-data]
c1ai = ["native/*.js", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
